services:

  # ── Flask Backend ──────────────────────────────────────
  - type: web
    name: fitvision-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    preDeployCommand: flask db upgrade

    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py

      # Auto-generated secrets — Render stores these securely
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # Reuse the existing free Postgres (shopaholics_db) — Render's free tier
      # only allows one free database per account. Paste its *Internal Database
      # URL* (from the DB's "Connections" page) into this var in the dashboard.
      - key: DATABASE_URL
        sync: false

      # Set manually in Render dashboard after first deploy
      # (needs the frontend service URL, known after it deploys)
      - key: FRONTEND_URL
        sync: false

      # Cloudinary (image storage) — set in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Hugging Face (AI try-on) — set in Render dashboard
      - key: HUGGINGFACE_API_TOKEN
        sync: false

      # Product catalog API (DummyJSON — no key needed)
      - key: PRODUCT_API_BASE_URL
        value: https://dummyjson.com

  # ── React Frontend ─────────────────────────────────────
  - type: web
    name: fitvision-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      # Set in Render dashboard: https://fitvision-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false

    routes:
      # Send all routes to index.html for React Router to handle
      - type: rewrite
        source: /*
        destination: /index.html

# Note: no `databases:` block — we reuse the existing free Postgres
# (shopaholics_db) by setting DATABASE_URL manually on the backend service.
# Render's free plan allows only one free database per account.
